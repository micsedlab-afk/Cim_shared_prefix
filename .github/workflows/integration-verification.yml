name: GPU evidence and integrated regression
on:
  push:
    branches: [integration/final-framework, implementation/causal-simulation-20261104, implementation/gpu-saving-frontier-20261104]
    paths-ignore:
      - 'results/integration/**'
      - 'results/gpu/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical regression dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile all model modules and GPU measurement harnesses
        run: |
          python -m compileall -q src/cim_shared_prefix scripts/benchmark_gpu_attention.py scripts/benchmark_real_decoder.py
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Guarantee absence of fabricated GPU observations on CPU runner
        run: |
          set +e
          python scripts/benchmark_gpu_attention.py --model llama --prefix 2048 --suffix 128 --batch 1 --output-tokens 128 --steps 0 --precision bf16 --out /tmp/gpu_unavailable.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          a=json.load(open('/tmp/gpu_unavailable.json'))
          assert a['status']=='UNAVAILABLE_NO_CUDA_DEVICE'
          assert a['measurements']==[]
          assert a['full_decoder_tpot_s'] is None
          PY

      - name: Execute 128-token source-macro causal simulation
        run: |
          python scripts/run_causal_7nm_sim.py --model llama --prefix 2048 \
            --suffix 128 --batch 1 --output-tokens 128 --area-mm2 16 \
            --support-mm2 0.5 --ports 256 --sram \
            --out /tmp/cim-causal-llama-2048-128.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cim-causal-llama-2048-128.json'))
          assert len(x['execution']['token_steps'])==128
          assert x['execution']['cim_macro_count']==4842
          assert x['execution']['cim_total_program_bytes']>0
          assert x['execution']['s0_model_mean_tpot_s'] is None
          assert x['execution']['s2_model_mean_tpot_s'] is None
          assert x['execution']['cim_mean_prefix_score_s']>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-causal-source-macro-timeline
          path: /tmp/cim-causal-llama-2048-128.json
          if-no-files-found: ignore

      - name: Convert executed study into matched GPU savings threshold
        run: |
          python scripts/derive_gpu_saving_thresholds.py \
            --csv /tmp/gpu-qk-saving-thresholds.csv \
            --summary /tmp/gpu-qk-saving-reference.json
          python - <<'PY'
          import csv,json
          with open('/tmp/gpu-qk-saving-thresholds.csv') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==2304
          x=json.load(open('/tmp/gpu-qk-saving-reference.json'))
          assert abs(x['reference_coordinate']['serial_policy_break_even_saving_us_per_layer']-6.058113)<1e-7
          assert all(r['competitive_speedup']=='' for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-derived-GPU-QK-savings-frontier
          path: |
            /tmp/gpu-qk-saving-thresholds.csv
            /tmp/gpu-qk-saving-reference.json
          if-no-files-found: ignore
