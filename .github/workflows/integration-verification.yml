name: Integrated science gates
on:
  push:
    branches: [integration/final-framework]
  workflow_dispatch:
jobs:
  repository-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full repository test suite
        run: python -m unittest discover -s tests -v
      - name: Source-grounded reproducibility
        run: |
          python scripts/run_source_sweep.py --help
          python scripts/run_residency_sweep.py --help
