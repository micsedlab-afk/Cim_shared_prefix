name: OJCAS Published S2 Stage-Delta Placement Audit
on:
  push:
    branches: [research/ojcas-published-stage-placement-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-S2-only-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the original paper and new stage-delta gates
        run: |
          python -m compileall -q src/cim_shared_prefix/ojcas_published_placement_delta.py scripts/run_ojcas_published_placement_delta.py
          python -m unittest -v tests.test_ojcas_manuscript_baseline tests.test_ojcas_placement_extension tests.test_ojcas_review_scope tests.test_ojcas_published_placement_delta
      - name: Compute 728 S2 K4 source, programming and native macro stage deltas
        run: |
          python scripts/run_ojcas_published_placement_delta.py --out-dir /tmp/ojcas_source_728
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('/tmp/ojcas_source_728')
          d=json.loads((p/'original_728_published_S2_placement_stage_delta.json').read_text())
          with (p/'original_728_published_S2_placement_stage_delta.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==728
          assert d['original_max_modeled_s2_QK_stage_speedup']==1.97
          assert d['new_full_decoder_TPOT'] is None
          assert d['new_s2_hardware_speedup'] is None
          assert d['native_CIM_access_ns']==5.5
          assert d['programming_64row_wave_ns'] == 12.8
          assert d['experimental_class'].startswith('executed paper-source')
          assert all(r['original_engine_macros']=='128' and not r['original_s2_model_historical_stage_speedup'] for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ojcas-original-728-S2-source-stage-placement-deltas
          path: /tmp/ojcas_source_728
          if-no-files-found: error
