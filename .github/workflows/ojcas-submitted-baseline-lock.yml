name: Preserve Submitted OJCAS S0 S1 S2 Baseline
on:
  push:
    branches: [fix/ojcas-preserve-submitted-baseline-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submitted-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and independently test original manuscript controls
        run: |
          python -m compileall -q src/cim_shared_prefix/ojcas_manuscript_baseline.py scripts/run_ojcas_manuscript_baseline.py
          python -m unittest -v tests.test_ojcas_manuscript_baseline tests.test_ojcas_728_requalification tests.test_ojcas_absolute_quality
      - name: Export original submitted 728-point model and energy without alternate sign multiplier
        run: |
          python scripts/run_ojcas_manuscript_baseline.py --out-dir /tmp/ojcas_submitted_baseline
          python - <<'PY'
          import csv,json,math
          from pathlib import Path
          p=Path('/tmp/ojcas_submitted_baseline')
          x=json.loads((p/'submitted_OJCAS_baseline_lock.json').read_text())
          with (p/'submitted_OJCAS_728_model_grid.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==728 and x['original_s2_macro_per_engine']==128
          assert x['original_s2_engine_area_mm2']==.4096
          assert x['paper_favorable_counts_by_area']['8']==60
          assert x['paper_favorable_counts_by_area']['12']==60
          assert x['paper_max_modeled_QK_stage_speedup']==1.97
          e=x['paper_macro_partial_energy']
          assert math.isclose(e['crossing_B_s1_hd'],40.85689802913453)
          assert math.isclose(e['crossing_B_s1_dp'],25.44644387317909)
          assert all(math.isclose(float(v['original_s2_engine_area_mm2']),.4096) for v in rows)
          assert all(not v['individual_s2_stage_speedup'] for v in rows)
          assert x['source_derived_number_of_individually_qualified_stage_times']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-OJCAS-submitted-baseline-lock
          path: /tmp/ojcas_submitted_baseline
          if-no-files-found: error
