name: GPU evidence and integrated regression
on:
  push:
    branches: [integration/final-framework]
    paths-ignore:
      - 'results/integration/**'
      - 'results/gpu/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical regression dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile all model modules and GPU measurement harnesses
        run: |
          python -m compileall -q src/cim_shared_prefix scripts/benchmark_gpu_attention.py scripts/benchmark_real_decoder.py
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
      - name: Guarantee absence of fabricated GPU observations on CPU runner
        run: |
          set +e
          python scripts/benchmark_gpu_attention.py --model llama --prefix 2048 --suffix 128 --batch 1 --output-tokens 128 --steps 0 --precision bf16 --out /tmp/gpu_unavailable.json
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          a=json.load(open('/tmp/gpu_unavailable.json'))
          assert a['status']=='UNAVAILABLE_NO_CUDA_DEVICE'
          assert a['measurements']==[]
          assert a['full_decoder_tpot_s'] is None
          PY

      - name: Execute 128-token source-macro causal simulation
        run: |
          python scripts/run_causal_7nm_sim.py --model llama --prefix 2048 \
            --suffix 128 --batch 1 --output-tokens 128 --area-mm2 16 \
            --support-mm2 0.5 --ports 256 --sram \
            --out /tmp/cim-causal-llama-2048-128.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/cim-causal-llama-2048-128.json'))
          assert len(x['execution']['token_steps'])==128
          assert x['execution']['cim_macro_count']==4842
          assert x['execution']['cim_total_program_bytes']>0
          assert x['execution']['s0_model_mean_tpot_s'] is None
          assert x['execution']['s2_model_mean_tpot_s'] is None
          assert x['execution']['cim_mean_prefix_score_s']>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-causal-source-macro-timeline
          path: /tmp/cim-causal-llama-2048-128.json
          if-no-files-found: ignore

      - name: Convert executed study into matched GPU savings threshold
        run: |
          python scripts/derive_gpu_saving_thresholds.py \
            --csv /tmp/gpu-qk-saving-thresholds.csv \
            --summary /tmp/gpu-qk-saving-reference.json
          python - <<'PY'
          import csv,json
          with open('/tmp/gpu-qk-saving-thresholds.csv') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==2304
          x=json.load(open('/tmp/gpu-qk-saving-reference.json'))
          assert abs(x['reference_coordinate']['serial_policy_break_even_saving_us_per_layer']-6.058113)<1e-7
          assert all(r['competitive_speedup']=='' for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-derived-GPU-QK-savings-frontier
          path: |
            /tmp/gpu-qk-saving-thresholds.csv
            /tmp/gpu-qk-saving-reference.json
          if-no-files-found: ignore


      - name: Execute paired A100 source roofline vs published 7nm CIM model
        run: |
          python scripts/compare_native_a100_model_7nm.py \
            --out /tmp/paired-a100-fp16-vs-7nm-cim-model.json
          python - <<'PY'
          import json, math
          v=json.load(open('/tmp/paired-a100-fp16-vs-7nm-cim-model.json'))
          assert v['status']=='EXECUTED_SOURCE_ROOFLINE_VS_7NM_MACRO_SERIAL_MODEL'
          assert len(v['token_points'])==128
          assert math.isclose(v['source_roofline_saving_us_per_layer'],1.0606611083864643,rel_tol=1e-9)
          assert math.isclose(v['source_threshold_us_per_layer'],6.058113,rel_tol=1e-9)
          assert math.isclose(v['S2_minus_S0_attention_model_difference_s_per_generated_token']*1e6,159.91846053163314,rel_tol=1e-9)
          assert v['global_GPU_vs_CIM_speedup'] is None
          assert v['qualified_end_to_end_TPOT_s'] is None
          assert v['GPU_source']['measured_hardware'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-source-native-a100-gqa-fp16-vs-7nm-cim
          path: /tmp/paired-a100-fp16-vs-7nm-cim-model.json
          if-no-files-found: ignore

      - name: Execute finite-buffer selective pinned-layer optimization
        run: |
          python scripts/run_selective_pipelined_study.py \
            --csv /tmp/selective-pipeline-conditions.csv \
            --summary /tmp/selective-pipeline-reference.json
          python - <<'PY'
          import csv,json,math
          with open('/tmp/selective-pipeline-conditions.csv') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==4*4*3*5*3
          summary=json.load(open('/tmp/selective-pipeline-reference.json'))
          r=summary['reference']
          assert r['policy_selected_layers']==1
          assert r['pipeline']['physical_storage_macros']==10
          assert math.isclose(r['candidate_minus_gpu_s_per_token']*1e6,
                              -.2440211083864641,rel_tol=1e-8)
          assert r['minimum_outputs_to_amortize_cold']==16
          assert all(r['hardware_speedup']=='' for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-selective-pipelined-7nm-policy
          path: |
            /tmp/selective-pipeline-conditions.csv
            /tmp/selective-pipeline-reference.json
          if-no-files-found: error


      - name: Compare against grouped shared-prefix GPU native source model
        run: |
          python scripts/compare_grouped_gpu_7nm_selective.py \
            --csv /tmp/grouped-gpu-vs-selective-cim.csv \
            --json /tmp/grouped-gpu-vs-selective-cim.json
          python - <<'PY'
          import csv,json,math
          r=json.load(open('/tmp/grouped-gpu-vs-selective-cim.json'))
          assert len(r['rows'])==6
          assert [x['batch'] for x in r['rows']]==[1,2,4,8,16,32]
          assert r['rows'][0]['status']=='CONDITIONAL_QK_WIN'
          assert r['rows'][0]['modeled_hybrid_minus_GPU_us_per_token']<0
          for row in r['rows']:
              assert row['buffer_area_mm2']<=.1+1e-12
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grouped-native-shared-prefix-GPU-vs-7nm-selective
          path: |
            /tmp/grouped-gpu-vs-selective-cim.csv
            /tmp/grouped-gpu-vs-selective-cim.json
          if-no-files-found: error
