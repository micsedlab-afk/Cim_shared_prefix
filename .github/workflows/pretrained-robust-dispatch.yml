name: Real GQA Two-Domain Robust Prefix-CIM Admission
on:
  push:
    branches: [research/prefix-summary-cim-20261105]
    paths:
      - 'scripts/evaluate_prefix_robust_dispatch.py'
      - 'scripts/evaluate_pretrained_compact_prefix.py'
      - 'src/cim_shared_prefix/compact_prefix_cim.py'
      - '.github/workflows/pretrained-robust-dispatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model-robust-CIM-GPU:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'numpy==1.26.4' 'transformers==4.46.3' 'safetensors>=0.4,<0.6' 'huggingface_hub>=0.26,<0.32'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Genuine pre-registered two-domain NLL admission, unseen third-domain evaluation
        run: |
          python scripts/evaluate_prefix_robust_dispatch.py \
            --prefix 128 --output 32 --centroids 64 --max-delta-nll 0.05 --threads 4 \
            --out /tmp/smol_robust_CIM_GPU_NLL.json \
            --csv /tmp/smol_robust_CIM_GPU_layer_evidence.csv
          python - <<'PY'
          import json,math
          r=json.load(open('/tmp/smol_robust_CIM_GPU_NLL.json'))
          assert r['schema']=='source-pretrained-smollm2-135m-two-domain-minimax-admission/v1'
          assert len(r['single_layer_calibration_A_delta_NLL'])==30
          assert len(r['single_layer_calibration_B_delta_NLL'])==30
          assert r['calibration_budget_delta_NLL']==.05
          assert len(r['heldout'])==1 and r['heldout'][0]['passage_index']==2
          assert math.isfinite(r['heldout_mean_delta_NLL'])
          assert r['next_token_targets_per_passage']==31
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pretrained-GQA-two-domain-NLL-calibration-and-unseen-test
          path: |
            /tmp/smol_robust_CIM_GPU_NLL.json
            /tmp/smol_robust_CIM_GPU_layer_evidence.csv
          if-no-files-found: warn
