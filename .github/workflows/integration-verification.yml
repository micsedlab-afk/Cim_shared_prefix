name: Integrated science gates
on:
  push:
    branches: [integration/final-framework]
    paths-ignore:
      - 'results/integration/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repository-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full repository test suite
        run: python -m unittest discover -s tests -v
      - name: Source-grounded reproducibility
        run: |
          PYTHONPATH=src python scripts/run_source_sweep.py /tmp/source-grounded
          PYTHONPATH=src python scripts/run_residency_sweep.py /tmp/physical-residency
          python scripts/export_quality_workloads.py --out /tmp/quality-geometry --profile-only
          PYTHONPATH=src python scripts/run_integrated_architecture.py /tmp/integrated-architecture
      - name: Commit deterministic integrated architecture results
        run: |
          mkdir -p results/integration
          cp -a /tmp/integrated-architecture/. results/integration/
          git add -f results/integration
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "results: regenerate qualified conditional physical envelope"
            for attempt in 1 2 3; do
              if git push origin HEAD:integration/final-framework; then
                echo "Published generated figures and CSV at $(git rev-parse HEAD)"
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-source-reproducibility
          path: |
            /tmp/source-grounded
            /tmp/physical-residency
            /tmp/quality-geometry
            /tmp/integrated-architecture
          if-no-files-found: ignore
